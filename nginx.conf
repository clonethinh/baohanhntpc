server {
    listen 80;
    server_name localhost;

    # 1. Phục vụ các tệp tin tĩnh đã build của Frontend React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ đắc lực cho React Router Dom (nếu reload trang web không bị lỗi 404)
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy ngược toàn bộ các yêu cầu HTTP '/api' về Backend API Container
    location /api {
        proxy_pass http://backend-api:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Proxy ngược các yêu cầu tải hình ảnh/đính kèm '/uploads' về Backend API Container
    location /uploads {
        proxy_pass http://backend-api:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cấu hình bảo mật HTTP cơ bản cấp độ máy chủ Web
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
