version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu quan hệ PostgreSQL Container
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: ntpc-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Ánh xạ thư mục dữ liệu SQL ra máy chủ vật lý VPS để lưu trữ bền vững (Persistent)
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ntpc-network

  # -------------------------------------------------------------
  # 2. Dịch Vụ API Backend (Node.js Express)
  # -------------------------------------------------------------
  backend-api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: ntpc-backend-api
    restart: always
    environment:
      - NODE_ENV=production
      - API_PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - INITIAL_STAFF_PASSWORD=${INITIAL_STAFF_PASSWORD}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - postgres-db
    # Ánh xạ các thư mục ảnh uploads và file backups để lưu trữ bền vững vật lý
    volumes:
      - ./api/uploads:/app/api/uploads
      - ./api/backups:/app/api/backups
    networks:
      - ntpc-network

  # -------------------------------------------------------------
  # 3. Dịch Vụ Web Frontend (Nginx phục vụ React SPA)
  # -------------------------------------------------------------
  frontend-web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: ntpc-frontend-web
    restart: always
    ports:
      - "8888:80"  # Ánh xạ cổng 80 của Nginx ra cổng 8888 ngoài máy thật để kiểm thử an toàn
    depends_on:
      - backend-api
    networks:
      - ntpc-network

# Định nghĩa mạng nội bộ cô lập đảm bảo các container giao tiếp an toàn
networks:
  ntpc-network:
    driver: bridge
