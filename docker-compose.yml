version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu quan hệ PostgreSQL Container
  # -------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: ntpc-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Ho_Chi_Minh
    # Ánh xạ thư mục dữ liệu SQL ra máy chủ vật lý VPS để lưu trữ bền vững (Persistent)
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ntpc-network

  # -------------------------------------------------------------
  # 2. Dịch Vụ API Backend (Node.js Express)
  # -------------------------------------------------------------
  backend-api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: ntpc-backend-api
    restart: always
    environment:
      - NODE_ENV=production
      - API_PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - INITIAL_STAFF_PASSWORD=${INITIAL_STAFF_PASSWORD}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      postgres-db:
        condition: service_healthy
    # Ánh xạ các thư mục ảnh uploads và file backups để lưu trữ bền vững vật lý
    # db.json bind-mount: bảng `customers` + adminConfig CHỈ sống trong file này
    # (không có trong PostgreSQL). Không mount → file ephemeral trong image, mọi
    # thao tác xóa/sửa khách hàng bị reset về bản COPY lúc build mỗi lần rebuild.
    volumes:
      - ./api/uploads:/app/api/uploads
      - ./api/backups:/app/api/backups
      - ./api/db.json:/app/api/db.json
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ntpc-network

  # -------------------------------------------------------------
  # 3. Dịch Vụ Web Frontend (Nginx phục vụ React SPA)
  # -------------------------------------------------------------
  frontend-web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: ntpc-frontend-web
    restart: always
    ports:
      - "8888:80"  # Ánh xạ cổng 80 của Nginx ra cổng 8888 ngoài máy thật để kiểm thử an toàn
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ntpc-network

  # -------------------------------------------------------------
  # 4. Dịch Vụ Cloudflare Quick Tunnel (trycloudflare.com)
  # -------------------------------------------------------------
  cloudflare-quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ntpc-cloudflare-quick-tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://frontend-web:80
    depends_on:
      - frontend-web
    networks:
      - ntpc-network

# Định nghĩa mạng nội bộ cô lập đảm bảo các container giao tiếp an toàn
networks:
  ntpc-network:
    driver: bridge
